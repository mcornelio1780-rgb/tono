<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tono · Tu IA, con tu tono</title>
<meta name="description" content="Convertimos tus textos en un Voice Pack para que ChatGPT, Claude o Gemini escriban como tú. Español, English, português, français.">
<meta property="og:title" content="Tono · Tu IA, con tu tono">
<meta property="og:description" content="Voice Packs para que cualquier IA escriba como tú, en 4 idiomas.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%232337E6'/%3E%3Cg fill='none' stroke='%23fff' stroke-width='13' stroke-linecap='round'%3E%3Cpath d='M50 34V78'/%3E%3Cpath d='M20 34C29 21 40 23 50 34S71 47 80 34'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..700,0..100;1,9..144,300..700,0..100&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --cobalto:#2337E6;--papel:#F7F6F2;--grafito:#17171C;--resaltador:#FFE14A;--niebla:#E4E4EC;--noche:#0F1A6E;--tachon:#E5484D;
  --bg:var(--papel);--fg:var(--grafito);--muted:#55555F;--line:#DCDCE4;--card:#fff;--accent:var(--cobalto);
  --serif:"Fraunces",Georgia,"Times New Roman",serif;--sans:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111117;--fg:#F2F1ED;--muted:#A6A6B4;--line:#2A2A35;--card:#1A1A22;--accent:#7C8BFF;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111117;--fg:#F2F1ED;--muted:#A6A6B4;--line:#2A2A35;--card:#1A1A22;--accent:#7C8BFF;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(76px + env(safe-area-inset-top,0px));scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
a{color:inherit}
.wrap{max-width:1200px;margin:0 auto;padding:0 clamp(20px,4vw,40px)}
h1,h2,h3{font-family:var(--serif);font-weight:400;letter-spacing:-.02em;margin:0}
p{margin:0 0 1em}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:14px 24px;font:600 15px var(--sans);text-decoration:none;cursor:pointer;border:1.5px solid transparent;transition:transform .15s}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--cobalto);color:#fff}
.btn-hl{background:var(--resaltador);color:#17171C}
.btn-ghost{border-color:currentColor;background:transparent;color:inherit}
:focus-visible{outline:3px solid var(--resaltador);outline-offset:3px}
.st{text-decoration:line-through;text-decoration-color:var(--tachon);text-decoration-thickness:3px;color:var(--muted)}
.hl{background:linear-gradient(transparent 58%,var(--resaltador) 58%);color:inherit}
/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
.nav{display:flex;align-items:center;gap:26px;height:68px}
.logo{width:78px;color:var(--accent);display:block}
.nav a.l{text-decoration:none;font-size:15px;color:var(--muted)}
.nav a.l:hover{color:var(--fg)}
.nav .sp{flex:1}
.langs{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px}
.langs button{border:none;background:none;color:var(--muted);font:600 13px var(--sans);padding:6px 10px;border-radius:999px;cursor:pointer}
.langs button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.menu-links{display:flex;gap:24px}
@media (max-width:860px){.menu-links{display:none}.nav{gap:12px}.nav .cta-top{padding:10px 14px;font-size:13px}}
/* hero */
.hero{padding:clamp(60px,10vw,120px) 0 70px}
.hero .robot{font-family:var(--serif);font-size:clamp(22px,3vw,34px);min-height:1.4em;color:var(--muted)}
.hero .robot.struck{text-decoration:line-through;text-decoration-color:var(--tachon);text-decoration-thickness:3px}
.hero h1{font-size:clamp(52px,9.5vw,148px);line-height:.95;margin-top:14px;color:var(--accent)}
.hero h1 .i{font-style:italic}
.hero .sub{font-size:clamp(18px,1.8vw,22px);max-width:48ch;color:var(--muted);margin:30px 0 34px}
.hero .ctas{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.hero .proof{margin-top:26px;font-size:14px;color:var(--muted)}
/* ticker */
.ticker{background:var(--cobalto);color:#fff;overflow:hidden;padding:20px 0;white-space:nowrap}
.ticker .row{display:inline-flex;gap:38px;animation:slide 40s linear infinite;font-family:var(--serif);font-size:clamp(26px,3.4vw,44px)}
.ticker .row span:nth-child(even){color:var(--resaltador)}
@keyframes slide{to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.ticker .row{animation:none}html{scroll-behavior:auto}}
/* sections */
section.s{padding:clamp(70px,10vw,130px) 0;border-bottom:1px solid var(--line)}
.kicker{font-size:15px;color:var(--accent);font-weight:600;margin-bottom:16px}
.s h2{font-size:clamp(38px,5.6vw,76px);line-height:1.02;max-width:16ch}
.s .intro{font-size:20px;color:var(--muted);max-width:56ch;margin-top:22px}
.tells{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin-top:56px;border-top:1px solid var(--line)}
.tells div{padding:28px 28px 10px 0;border-right:1px solid var(--line)}
.tells div:last-child{border-right:none}
.tells .big{font-family:var(--serif);font-size:24px;line-height:1.25;margin-bottom:10px}
@media (max-width:860px){.tells{grid-template-columns:1fr}.tells div{border-right:none;border-bottom:1px solid var(--line);padding:24px 0}}
/* stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:48px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:26px}
.stat b{display:block;font-family:var(--serif);font-weight:400;font-size:clamp(48px,6vw,76px);line-height:1;color:var(--accent)}
.stat p{margin:12px 0 8px;font-size:16.5px}
.stat small{font-size:12.5px;color:var(--muted)}
.solve{margin-top:40px;font-family:var(--serif);font-size:clamp(22px,2.6vw,30px);line-height:1.3;max-width:34ch}
.solve .hl{padding:0 3px}
@media (max-width:860px){.stats{grid-template-columns:1fr}}
/* compare */
.compare{margin-top:48px;display:grid;grid-template-columns:260px 1fr;gap:36px}
.ctabs{display:flex;flex-direction:column;gap:6px}
.ctabs button{text-align:left;border:1px solid var(--line);background:var(--card);color:var(--fg);padding:16px 18px;border-radius:8px;font:500 16px var(--sans);cursor:pointer}
.ctabs button[aria-selected="true"]{border-color:var(--cobalto);box-shadow:inset 4px 0 0 var(--cobalto)}
.cpanel{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.cswitch{display:flex;border-bottom:1px solid var(--line)}
.cswitch button{flex:1;border:none;background:none;padding:16px;font:600 15px var(--sans);color:var(--muted);cursor:pointer}
.cswitch button[aria-pressed="true"]{color:var(--fg);box-shadow:inset 0 -3px 0 var(--fg)}
.ctext{padding:30px 34px;font-family:var(--serif);font-size:20px;line-height:1.55;white-space:pre-line;min-height:280px}
.ctext mark{background:none;text-decoration:line-through;text-decoration-color:var(--tachon);text-decoration-thickness:2px;color:inherit}
.cnote{padding:14px 34px;border-top:1px solid var(--line);font-size:14px;color:var(--muted)}
@media (max-width:860px){.compare{grid-template-columns:1fr}.ctabs{flex-direction:row;overflow-x:auto}.ctabs button{white-space:nowrap}.ctext{padding:22px}}
/* steps */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;margin-top:56px;counter-reset:st}
.step{border-top:2px solid var(--fg);padding-top:20px}
.step .n{font-family:var(--serif);font-size:64px;line-height:1;color:var(--accent)}
.step h3{font-size:28px;margin:14px 0 10px}
.step p{color:var(--muted)}
@media (max-width:860px){.steps{grid-template-columns:1fr}}
/* pack */
.pack{display:grid;grid-template-columns:1.1fr .9fr;gap:50px;align-items:start;margin-top:50px}
.pack ul{list-style:none;padding:0;margin:0}
.pack li{display:grid;grid-template-columns:40px 1fr;gap:12px;padding:18px 0;border-bottom:1px solid var(--line)}
.pack li b{display:block;font-size:18px}
.pack li span{color:var(--muted)}
.pack .ic{width:32px;height:32px;color:var(--accent)}
.doc{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:28px;font-size:14.5px;position:sticky;top:100px}
.doc .h{font-family:var(--serif);font-size:24px;margin-bottom:12px}
.doc pre{white-space:pre-wrap;font:13.5px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;background:color-mix(in srgb,var(--cobalto) 7%,transparent);padding:14px;border-radius:8px;margin:12px 0 0}
@media (max-width:860px){.pack{grid-template-columns:1fr}.doc{position:static}}
/* icp */
.icp{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-top:50px}
.icp div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:24px}
.icp h3{font-size:24px;margin-bottom:10px}
.icp p{color:var(--muted);font-size:15.5px}
@media (max-width:960px){.icp{grid-template-columns:1fr 1fr}}@media (max-width:560px){.icp{grid-template-columns:1fr}}
/* pricing */
.pricing{background:var(--grafito);color:#F2F1ED;border-bottom:none}
.pricing .kicker{color:var(--resaltador)}
.pricing .intro{color:#B9B9C6}
.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:54px}
.plan{border:1px solid #33333F;border-radius:12px;padding:30px;display:flex;flex-direction:column}
.plan.feat{background:var(--cobalto);border-color:var(--cobalto)}
.plan h3{font-size:28px}
.plan .price{font-family:var(--serif);font-size:64px;line-height:1;margin:20px 0 6px}
.plan .per{font-size:14px;opacity:.75;margin-bottom:22px}
.plan ul{list-style:none;padding:0;margin:0 0 28px;flex:1}
.plan li{padding:9px 0;border-top:1px solid rgba(255,255,255,.12);font-size:15.5px}
.plan .badge{align-self:flex-start;background:var(--resaltador);color:#17171C;font-size:13px;font-weight:700;padding:4px 10px;border-radius:999px;margin-bottom:14px}
.code{margin-top:28px;font-size:15px;color:#B9B9C6}
.code b{color:var(--resaltador)}
@media (max-width:900px){.plans{grid-template-columns:1fr}}
/* founder */
.founder{display:grid;grid-template-columns:1fr 1.3fr;gap:50px;align-items:center}
.founder blockquote{margin:0;font-family:var(--serif);font-size:clamp(24px,3vw,36px);line-height:1.3}
.founder .who{margin-top:20px;color:var(--muted)}
.portrait{aspect-ratio:4/5;border-radius:10px;background:var(--cobalto);display:flex;align-items:center;justify-content:center;color:#fff}
@media (max-width:860px){.founder{grid-template-columns:1fr}.portrait{max-width:320px}}
/* faq */
.faq{margin-top:46px;border-top:1px solid var(--line)}
.faq details{border-bottom:1px solid var(--line)}
.faq summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:56px 1fr 30px;gap:10px;padding:24px 0;font-family:var(--serif);font-size:clamp(20px,2.2vw,26px)}
.faq summary::-webkit-details-marker{display:none}
.faq summary .n{color:var(--accent);font-size:18px;padding-top:6px;font-family:var(--sans);font-weight:600}
.faq summary .pm{font-family:var(--sans);font-size:26px;text-align:right;transition:transform .2s}
.faq details[open] .pm{transform:rotate(45deg)}
.faq .a{padding:0 40px 26px 66px;color:var(--muted);max-width:76ch}
@media (max-width:600px){.faq summary{grid-template-columns:40px 1fr 24px}.faq .a{padding-left:0;padding-right:0}}
/* lead */
.lead{background:var(--resaltador);color:#17171C;border-bottom:none}
.lead h2{color:#17171C}
.lead .intro{color:#3a3a2a}
.lead form{display:flex;flex-wrap:wrap;gap:10px;margin-top:34px;max-width:640px}
.lead input,.lead select{flex:1 1 240px;border:1.5px solid #17171C;background:#fff;border-radius:999px;padding:14px 20px;font:16px var(--sans);color:#17171C}
.lead .btn{background:#17171C;color:#fff}
.lead .msg{margin-top:14px;font-weight:600;min-height:1.5em}
.lead small{display:block;margin-top:10px;font-size:13px;color:#4a4a3a}
footer{padding:60px 0 40px;font-size:14px;color:var(--muted)}
footer .row{display:flex;flex-wrap:wrap;gap:24px;justify-content:space-between;align-items:center}
footer nav{display:flex;flex-wrap:wrap;gap:18px}
footer a{text-decoration:none}
.live{margin-top:40px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px;max-width:760px}
.live label{font-weight:600;font-size:15px}
.live textarea{width:100%;min-height:96px;margin-top:10px;border:1px solid var(--line);border-radius:8px;padding:14px;font:17px/1.5 var(--serif);background:var(--bg);color:var(--fg);resize:vertical}
.live .out{margin-top:12px;font-size:15px;color:var(--muted)}
.live .out .score{font-weight:700;color:var(--fg)}
.chip{display:inline-block;margin:4px 6px 0 0;padding:3px 10px;border-radius:999px;background:color-mix(in srgb,var(--tachon) 14%,transparent);color:var(--fg);font-size:13.5px}
/* cuenta, contacto y pie */
.acct-slot{display:flex;align-items:center}
.acct-slot .btn{padding:10px 16px;font-size:14px}
.contact{margin-top:60px;display:grid;grid-template-columns:.9fr 1.1fr;gap:40px;align-items:start}
.contact h3{font-family:var(--serif);font-weight:400;font-size:clamp(28px,3vw,40px);margin:0 0 10px}
.contact p{color:var(--muted)}
.cform{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px;display:grid;gap:12px}
.cform label{font-size:13.5px;font-weight:600}
.cform input,.cform select,.cform textarea{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:10px;padding:12px;font:16px var(--sans)}
.cform textarea{min-height:130px;resize:vertical}
.cform .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--muted);line-height:1.45}
.chk input{width:auto;margin-top:3px}
.chk a{color:var(--accent)}
.cmsg{min-height:1.4em;font-size:14px;font-weight:600}
.lead .chk{color:#3a3a2a;margin-top:12px;max-width:640px}
.lead .chk a{color:#17171C}
.pr-note{font-size:14px;color:#B9B9C6;margin-top:8px}
footer .legal{margin-top:22px;font-size:12.5px;line-height:1.6;max-width:90ch}
@media (max-width:860px){.contact{grid-template-columns:1fr}.cform .two{grid-template-columns:1fr}}
@media (max-width:560px){.nav .cta-top{display:none}.langs button{padding:6px 7px}.acct-slot .btn{padding:9px 12px;font-size:13px}.nav{gap:8px}}
</style>
<script src="config.js"></script>
<script src="tono-core.js"></script>
</head>
<body>
<header>
  <div class="wrap nav">
    <a href="#top" aria-label="Tono"><span class="logo" id="logoTop"></span></a>
    <nav class="menu-links" aria-label="Main">
      <a class="l" href="#how" data-i="nav_how"></a>
      <a class="l" href="#pricing" data-i="nav_pricing"></a>
      <a class="l" href="#faq" data-i="nav_faq"></a>
    </nav>
    <span class="sp"></span>
    <div class="langs" role="group" aria-label="Language">
      <button data-lang="es">ES</button><button data-lang="en">EN</button><button data-lang="pt">PT</button><button data-lang="fr">FR</button>
    </div>
    <div class="acct-slot" id="acctTop" data-app="app.html"></div>
    <a class="btn btn-primary cta-top" data-href="mvp" data-i="cta_try"></a>
  </div>
</header>

<main id="top">
  <section class="hero">
    <div class="wrap">
      <div class="robot" id="robot" aria-hidden="true"></div>
      <h1><span data-i="h1a"></span><br><span class="i" data-i="h1b"></span></h1>
      <p class="sub" data-i="hero_sub"></p>
      <div class="ctas">
        <a class="btn btn-primary" data-href="mvp" data-i="cta_try"></a>
        <a class="btn btn-ghost" href="#pricing" data-i="cta_pricing"></a>
      </div>
      <p class="proof" data-i="hero_proof"></p>
      <div class="live">
        <label for="liveIn" data-i="live_label"></label>
        <textarea id="liveIn"></textarea>
        <div class="out" id="liveOut" aria-live="polite"></div>
      </div>
    </div>
  </section>

  <div class="ticker" aria-hidden="true"><div class="row" id="ticker"></div></div>

  <section class="s" id="problem">
    <div class="wrap">
      <div class="kicker" data-i="p_kick"></div>
      <h2 data-i="p_h"></h2>
      <p class="intro" data-i="p_intro"></p>
      <div class="tells">
        <div><div class="big" data-i="t1h"></div><p data-i="t1p"></p></div>
        <div><div class="big" data-i="t2h"></div><p data-i="t2p"></p></div>
        <div><div class="big" data-i="t3h"></div><p data-i="t3p"></p></div>
      </div>
      <div class="stats" id="stats"></div>
      <p class="solve" id="solve"></p>
    </div>
  </section>

  <section class="s" id="compare">
    <div class="wrap">
      <div class="kicker" data-i="c_kick"></div>
      <h2 data-i="c_h"></h2>
      <div class="compare">
        <div class="ctabs" role="tablist" id="ctabs"></div>
        <div class="cpanel">
          <div class="cswitch"><button data-mode="ai" aria-pressed="true" data-i="c_ai"></button><button data-mode="tono" aria-pressed="false" data-i="c_tono"></button></div>
          <div class="ctext" id="ctext"></div>
          <div class="cnote" id="cnote"></div>
        </div>
      </div>
    </div>
  </section>

  <section class="s" id="how">
    <div class="wrap">
      <div class="kicker" data-i="h_kick"></div>
      <h2 data-i="h_h"></h2>
      <div class="steps">
        <div class="step"><div class="n">1</div><h3 data-i="s1h"></h3><p data-i="s1p"></p></div>
        <div class="step"><div class="n">2</div><h3 data-i="s2h"></h3><p data-i="s2p"></p></div>
        <div class="step"><div class="n">3</div><h3 data-i="s3h"></h3><p data-i="s3p"></p></div>
      </div>
    </div>
  </section>

  <section class="s" id="pack">
    <div class="wrap">
      <div class="kicker" data-i="k_kick"></div>
      <h2 data-i="k_h"></h2>
      <div class="pack">
        <ul id="packList"></ul>
        <div class="doc"><div class="h" data-i="doc_h"></div><div data-i="doc_p"></div><pre id="docPre"></pre></div>
      </div>
    </div>
  </section>

  <section class="s" id="who">
    <div class="wrap">
      <div class="kicker" data-i="w_kick"></div>
      <h2 data-i="w_h"></h2>
      <div class="icp" id="icp"></div>
    </div>
  </section>

  <section class="s pricing" id="pricing">
    <div class="wrap">
      <div class="kicker" data-i="pr_kick"></div>
      <h2 data-i="pr_h"></h2>
      <p class="intro" data-i="pr_intro"></p>
      <div class="plans" id="plans"></div>
      <p class="code" data-i="pr_code"></p>
      <p class="pr-note" data-i="pr_acct"></p>
    </div>
  </section>

  <section class="s" id="founder">
    <div class="wrap founder">
      <div class="portrait"><div style="width:42%" id="logoIso"></div></div>
      <div><blockquote data-i="f_q"></blockquote><div class="who" data-i="f_who"></div></div>
    </div>
  </section>

  <section class="s" id="faq">
    <div class="wrap">
      <div class="kicker" data-i="q_kick"></div>
      <h2 data-i="q_h"></h2>
      <div class="faq" id="faqList"></div>
      <div class="contact" id="contact">
        <div><h3 data-i="c2_h"></h3><p data-i="c2_p"></p></div>
        <form class="cform" id="contactForm" novalidate>

  $("#plans").innerHTML=t.plans.map(p=>`<div class="plan${p.feat?" feat":""}">${p.badge?`<span class="badge">${p.badge}</span>`:""}<h3>${p.n}</h3><div class="price">${p.p}</div><div class="per">${p.per}</div><ul>${p.f.map(x=>`<li>${x}</li>`).join("")}</ul><button type="button" class="btn ${p.feat?"btn-hl":"btn-ghost"}" data-buy="${p.k}">${p.b}</button></div>`).join("")+"";
  $("#cTopic").innerHTML=X[lang].topics.map(o=>`<option>${o}</option>`).join("");
  $("#ftLegal").innerHTML=X[lang].legal.replace("{addr}",esc((TC.company&&TC.company.address)||""));
  if(window.Tono){Tono.setLang(lang);$(".pr-note").hidden=!Tono.accounts}
  $("#faqList").innerHTML=t.faq.map((f,i)=>`<details${i===0?" open":""}><summary><span class="n">${String(i+1).padStart(2,"0")}</span><span>${f[0]}</span><span class="pm" aria-hidden="true">+</span></summary><div class="a">${f[1]}</div></details>`).join("");
  $("#leadEmail").placeholder=t.l_ph;
  $("#leadRole").innerHTML=t.l_roles.map(r=>`<option>${r}</option>`).join("");
  $("#ctabs").innerHTML=CMP[lang].map((c,i)=>`<button role="tab" aria-selected="${i===cmpIdx}" data-ci="${i}">${c.tab}</button>`).join("");
  renderCmp();detect();
}
function renderCmp(){
  const c=CMP[lang][cmpIdx];
  document.querySelectorAll(".cswitch button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.mode===cmpMode));
  if(cmpMode==="ai"){let h=esc(c.ai);TELLS[lang].sort((a,b)=>b.length-a.length).forEach(p=>{h=h.replace(new RegExp(p.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"gi"),m=>`<mark>${m}</mark>`)});$("#ctext").innerHTML=h;$("#cnote").textContent="";}
  else{$("#ctext").textContent=c.tono;$("#cnote").textContent=c.note;}
}
function detect(){
  const v=$("#liveIn").value.toLowerCase();const t=T[lang];
  if(!v.trim()){$("#liveOut").textContent="";return}
  const all=[...new Set(Object.values(TELLS).flat())];const hits=all.filter(p=>v.includes(p));
  const words=v.split(/\s+/).filter(Boolean).length||1;
  const score=Math.min(100,Math.round(hits.length*18+((v.match(/[🚀👇✨💡🔥]/gu)||[]).length*6)+(v.match(/—/g)||[]).length*4));
  $("#liveOut").innerHTML=hits.length?`<span class="score">${t.live_score}: ${score}/100</span> · ${hits.length} ${t.live_found}<br>${hits.map(h=>`<span class="chip">${esc(h)}</span>`).join("")}`:t.live_none;
}
document.addEventListener("click",e=>{
  const lb=e.target.closest("[data-lang]");if(lb){setLang(lb.dataset.lang);return}
  const ct=e.target.closest("[data-ci]");if(ct){cmpIdx=+ct.dataset.ci;cmpMode="ai";render();return}
  const cm=e.target.closest("[data-mode]");if(cm){cmpMode=cm.dataset.mode;renderCmp()}
});
$("#liveIn").addEventListener("input",detect);
function setLang(l){lang=l;try{localStorage.setItem("tono_lang",l)}catch(e){}history.replaceState(null,"","#"+l);render();typeRobot()}
$("#leadForm").addEventListener("submit",async e=>{
  e.preventDefault();const t=T[lang];const email=$("#leadEmail").value.trim();
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)){$("#leadMsg").textContent=t.l_err;return}
  if(!$("#leadConsent").checked){$("#leadMsg").textContent=X[lang].need_consent;return}
  const btn=e.target.querySelector("button");btn.disabled=true;
  try{await Tono.ready;await Tono.Data.saveLead({email,role:$("#leadRole").value,source:"landing-muletillas",consent:true});$("#leadMsg").textContent=t.l_ok;e.target.reset();$("#leadConsent").checked=false}
  catch(err){$("#leadMsg").textContent=X[lang].send_err}
  finally{btn.disabled=false}
});
/* Una sola animación orquestada: la frase robótica se escribe y se tacha */
let typer;
function typeRobot(){
  clearInterval(typer);const el=$("#robot");const s=T[lang].robot;el.classList.remove("struck");
  if(matchMedia("(prefers-reduced-motion: reduce)").matches){el.textContent=s;el.classList.add("struck");return}
  let i=0;el.textContent="";typer=setInterval(()=>{el.textContent=s.slice(0,++i);if(i>=s.length){clearInterval(typer);setTimeout(()=>el.classList.add("struck"),350)}},28);
}
(function init(){
  const h=location.hash.slice(1);let saved=null;try{saved=localStorage.getItem("tono_lang")}catch(e){}
  const nav=(navigator.language||"es").slice(0,2);
  lang=T[h]?h:T[saved]?saved:T[nav]?nav:"es";render();typeRobot();
  addEventListener("hashchange",()=>{const k=location.hash.slice(1);if(T[k]&&k!==lang)setLang(k)});
  Tono.mountAccount($("#acctTop"));
})();
/* Compra: cuenta → (verificación) → checkout de Polar con el correo ya puesto */
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-buy]");if(!b)return;
  const plan=b.dataset.buy;
  const go=()=>Tono.Checkout.go(plan);
  if(!Tono.Checkout.ready(plan)){go();return}
  if(!Tono.accounts){go();return}
  const u=Tono.user;
  if(!u){Tono.openAuth("signup",go);return}
  if(u.provider==="password"&&!u.verified){Tono.openAuth("verify",go);return}
  go();
});
document.addEventListener("tono:soon",()=>{const x={es:"Las compras abren en unos días. Déjanos tu correo aquí y te avisamos primero.",en:"Purchases open in a few days. Leave your email here and we'll tell you first.",pt:"As compras abrem em poucos dias. Deixe seu e-mail aqui e avisamos primeiro.",fr:"Les achats ouvrent dans quelques jours. Laissez votre e-mail ici et vous serez prévenu en premier."}[lang];
  $("#lead").scrollIntoView({behavior:"smooth"});$("#leadMsg").textContent=x;setTimeout(()=>$("#leadEmail").focus({preventScroll:true}),600)});
$("#contactForm").addEventListener("submit",async e=>{
  e.preventDefault();const x=X[lang];const out=$("#cMsgOut");out.style.color="";
  const email=$("#cEmail").value.trim(),msg=$("#cMsg").value.trim();
  if(!Tono.isEmail(email)){out.textContent=T[lang].l_err;return}
  if(msg.length<5){out.textContent=x.need_msg;return}
  if(!$("#cConsent").checked){out.textContent=x.need_consent;return}
  const btn=e.target.querySelector("button");btn.disabled=true;
  try{await Tono.ready;await Tono.Data.saveContact({name:$("#cName").value.trim(),email,topic:$("#cTopic").value,message:msg});out.style.color="var(--ok,#1E8E5A)";out.textContent=x.c_ok;e.target.reset()}
  catch(err){out.textContent=x.send_err}
  finally{btn.disabled=false}
});
</script>
</body>
