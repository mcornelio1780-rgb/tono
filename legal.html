es:{tabs:{terms:"Términos",privacy:"Privacidad",ai:"Uso de IA y regulación"},updated:"Última actualización",draft:"Versión 1.0. Documento redactado para el lanzamiento; lo revisará un abogado. Si una ley de tu país te da más derechos, se aplica esa ley.",back:"Volver a Tono",
terms:{title:"Términos y condiciones",s:[
["1. Quiénes somos","Tono es un servicio de {company}, sociedad de responsabilidad limitada constituida en Delaware, Estados Unidos, con domicilio en {addr}. Contacto: <a href=\"mailto:{email}\">{email}</a>."],
["2. Qué ofrecemos","Tono analiza textos que tú aportas y genera un <b>Voice Pack</b>: una guía de estilo, una instrucción para asistentes de IA (como ChatGPT, Claude o Gemini) y listas de frases a evitar. El análisis y el detector son gratuitos; el Voice Pack completo y los planes Pro y Agencias son pagos únicos."],
["3. Tu cuenta","Debes ser mayor de 18 años (o de la mayoría de edad de tu país) y dar datos reales. Puedes registrarte con correo, que debes activar desde el enlace que te enviamos, o con Google. Eres responsable de mantener segura tu contraseña y de la actividad de tu cuenta."],
["4. Precios y pagos","Los precios se muestran en dólares estadounidenses. Los pagos los procesa <b>Polar</b> como Merchant of Record (vendedor registrado): Polar cobra, calcula y liquida los impuestos que correspondan y emite el comprobante. Tono no ve ni guarda los datos de tu tarjeta. Tras pagar recibes una <b>clave de licencia</b> personal para activar tu compra en tu cuenta. Cada plan cubre un número de voces: Voice Pack 1, Pro 1 y Agencias 5."],
["5. Reembolsos","Voice Pack: puedes pedir el reembolso dentro de los 14 días siguientes a la compra si todavía no activaste la clave. Pro y Agencias: incluyen dos rondas de ajuste; si después no sentimos que el pack suene a ti, te devolvemos el dinero si lo pides dentro de 30 días. Escríbenos a {email}. Esto no limita los derechos que te dé la ley de consumo de tu país."],
["6. Tus textos y tu Voice Pack","Tus textos siguen siendo tuyos. Nos das permiso limitado para procesarlos solo con el fin de prestarte el servicio. El Voice Pack que generas es para tu uso; puedes usarlo en cualquier herramienta de IA. Declaras tener derecho a usar los textos que aportas."],
["7. Uso aceptable","No puedes usar Tono para: crear el Voice Pack de otra persona sin su autorización; suplantar identidades o engañar sobre quién escribe; fraude, spam o desinformación; incumplir normas académicas o profesionales sobre el uso de IA; ni infringir derechos de terceros o la ley. Podemos suspender cuentas que lo hagan."],
["8. Resultados de la IA","Los textos que produzca una IA con tu Voice Pack pueden contener errores. Revísalos antes de publicarlos: eres responsable de lo que publicas. Las herramientas de terceros (ChatGPT, Claude, Gemini u otras) se rigen por sus propios términos. No prometemos que un texto no sea identificado como generado por IA."],
["9. Disponibilidad y cambios","Trabajamos para que Tono funcione siempre, pero puede haber interrupciones. Podemos mejorar o cambiar funciones; si un cambio afecta algo que pagaste, te avisaremos."],
["10. Responsabilidad","En la medida en que la ley lo permita, la responsabilidad total de {company} frente a ti se limita a lo que pagaste en los últimos 12 meses. Nada de esto excluye responsabilidades que la ley no permite excluir."],
["11. Ley aplicable","Estos términos se rigen por las leyes del Estado de Delaware, EE.UU. Si eres consumidor, conservas la protección de las leyes obligatorias de tu país de residencia y puedes acudir a sus tribunales."],
["12. Contacto","Para cualquier duda sobre estos términos: <a href=\"mailto:{email}\">{email}</a>."]]},
privacy:{title:"Política de privacidad",s:[
["1. Responsable","{company}, {addr}. Contacto de privacidad: <a href=\"mailto:{privacy}\">{privacy}</a>."],
["2. Qué datos tratamos","<ul><li><b>Cuenta</b>: correo, nombre, idioma, método de acceso (correo o Google) y tus consentimientos.</li><li><b>Textos que analizas</b>: el análisis se hace en tu navegador. Solo se guardan en nuestros servidores si guardas un Voice Pack en tu cuenta o pides la revisión Pro.</li><li><b>Voice Packs guardados</b> y datos de tu licencia (plan y clave).</li><li><b>Formularios</b>: los mensajes de contacto y la suscripción a la lista.</li><li><b>Compras</b>: Polar nos informa tu correo, el producto y la licencia. No recibimos datos de tarjeta.</li><li><b>Datos técnicos mínimos</b> de inicio de sesión que registra nuestro proveedor de autenticación por seguridad.</li></ul>No usamos cookies de publicidad ni herramientas de seguimiento de terceros. Guardamos preferencias (idioma, borradores) en el almacenamiento local de tu navegador."],
["3. Para qué y con qué base","Prestarte el servicio y gestionar tu cuenta y compras (ejecución del contrato); responder tus mensajes y proteger el servicio (interés legítimo); enviarte novedades solo si lo aceptaste (consentimiento, que puedes retirar cuando quieras); cumplir obligaciones legales."],
["4. Con quién los compartimos","Solo con proveedores que nos ayudan a operar, bajo contrato: Google Firebase (cuentas y base de datos), Polar (pagos e impuestos), nuestro proveedor de alojamiento web (Cloudflare o Vercel) y, si está activado, FormSubmit para avisarnos de mensajes de contacto. Si usas la función opcional de reescritura con tu propia clave de API, tu texto se envía directamente a ese proveedor de IA. No vendemos ni compartimos tus datos con fines publicitarios."],
["5. Transferencias internacionales","Nuestros proveedores pueden tratar datos en Estados Unidos y otros países. Usamos proveedores que ofrecen garantías reconocidas, como las cláusulas contractuales tipo de la Unión Europea."],
["6. Cuánto tiempo","Cuenta y Voice Packs: mientras tengas la cuenta. Textos de revisión Pro: se borran 30 días después de la entrega. Mensajes de contacto: hasta 24 meses. Lista de correo: hasta que te des de baja. Datos de facturación: los que exija la ley (los gestiona Polar)."],
["7. Tus derechos","Puedes pedir acceso, corrección, borrado, portabilidad, oposición o limitación del tratamiento, y retirar tu consentimiento, escribiendo a {privacy}. Respondemos en un máximo de 30 días. Según dónde vivas: <ul><li><b>UE/EEE y Reino Unido</b> (RGPD): puedes reclamar ante tu autoridad de protección de datos.</li><li><b>Brasil</b> (LGPD): puedes acudir a la ANPD.</li><li><b>California</b> (CCPA/CPRA): no vendemos ni compartimos datos personales; no te discriminamos por ejercer tus derechos.</li><li><b>Perú</b> (Ley 29733): derechos ARCO ante la Autoridad Nacional de Protección de Datos Personales.</li><li><b>Otros países</b>: aplicamos estos mismos derechos.</li></ul>"],
["8. Menores","Tono no está dirigido a menores de 18 años y no recopilamos sus datos a sabiendas."],
["9. Seguridad","Usamos conexiones cifradas, contraseñas gestionadas por Firebase (nunca las vemos) y reglas que impiden que un usuario lea datos de otro. Si ocurriera un incidente que te afecte, te avisaremos según la ley."],
["10. Cambios","Si cambiamos esta política te lo diremos en la web y, si es importante, por correo."]]},
ai:{title:"Uso de inteligencia artificial y regulación",s:[
["1. Qué hace la IA en Tono","<ul><li><b>Análisis de voz y detector</b>: funcionan en tu navegador con métodos estadísticos y listas de expresiones; no usan un modelo generativo ni envían tus textos a terceros.</li><li><b>Voice Pack</b>: es un conjunto de instrucciones que tú usas en asistentes de IA de terceros (ChatGPT, Claude, Gemini u otros). Esos textos los genera el sistema del proveedor que elijas, bajo sus propios términos.</li><li><b>Reescritura opcional</b>: si introduces tu propia clave de API, tu texto se envía a ese proveedor solo cuando tú lo pides.</li><li><b>Plan Pro</b>: un editor humano revisa y ajusta el pack.</li></ul>"],
["2. Nuestros compromisos","<ul><li><b>Transparencia</b>: decimos claramente qué partes son automáticas y cuáles son humanas.</li><li><b>Tus textos no entrenan modelos</b> salvo que nos des un permiso aparte, opcional y revocable.</li><li><b>Supervisión humana</b>: tú decides qué publicas; Tono no publica nada por ti.</li><li><b>Sin decisiones automatizadas</b> con efectos legales o similares sobre personas.</li><li><b>Sin suplantación</b>: solo puedes crear el Voice Pack de tu propia voz o de alguien que te autorizó.</li><li><b>Promesas honestas</b>: no vendemos “evadir detectores”; ayudamos a que el texto suene a ti.</li></ul>"],
["3. Unión Europea · Reglamento de IA (UE) 2024/1689","Tono no realiza prácticas prohibidas y no es un sistema de alto riesgo: es una herramienta de asistencia a la escritura. Las obligaciones de transparencia del artículo 50 se aplican desde el 2 de agosto de 2026. Tono informa a sus usuarios cuándo interviene la IA. El marcado técnico del contenido generado por IA (art. 50.2) corresponde a los proveedores de los modelos que lo generan. Si publicas texto generado o manipulado por IA para informar al público sobre asuntos de interés público, el art. 50.4 puede exigirte indicarlo, salvo que haya revisión humana y alguien asuma la responsabilidad editorial."],
["4. Perú · Ley 31814 y su Reglamento (D.S. 115-2025-PCM)","El Reglamento rige desde el 22 de enero de 2026. Aplicamos sus principios de transparencia, privacidad, supervisión humana y no discriminación, y tratamos los datos según la Ley 29733 de Protección de Datos Personales."],
["5. Brasil","El marco legal de IA (PL 2338/2023) sigue en trámite en la Cámara de Diputados. Mientras tanto aplicamos la LGPD y las orientaciones de la ANPD, y nos adaptaremos cuando se apruebe la ley."],
["6. Estados Unidos","No hay una ley federal general de IA. Seguimos la normativa de protección al consumidor sobre publicidad veraz (FTC) y las leyes estatales de privacidad aplicables. Tono no toma decisiones relevantes sobre empleo, crédito, vivienda u otras áreas reguladas por leyes estatales de IA."],
["7. Otros países","En Canadá, México, Colombia, Chile, Argentina y el resto de mercados aplicamos las leyes de datos personales vigentes y estos mismos principios. Revisamos esta página cuando cambia la regulación."],
["8. Contacto","Preguntas sobre IA, datos o un uso indebido de Tono: <a href=\"mailto:{privacy}\">{privacy}</a>."]]}},

en:{tabs:{terms:"Terms",privacy:"Privacy",ai:"AI use & regulation"},updated:"Last updated",draft:"Version 1.0. Drafted for launch; pending review by counsel. If your local law gives you more rights, that law applies.",back:"Back to Tono",
terms:{title:"Terms of Service",s:[
["1. Who we are","Tono is a service of {company}, a limited liability company organized in Delaware, United States, located at {addr}. Contact: <a href=\"mailto:{email}\">{email}</a>."],
["2. What we offer","Tono analyzes texts you provide and generates a <b>Voice Pack</b>: a style guide, an instruction for AI assistants (such as ChatGPT, Claude or Gemini) and lists of phrases to avoid. Analysis and the detector are free; the full Voice Pack and the Pro and Agency plans are one-time payments."],
["3. Your account","You must be 18 or older (or the age of majority where you live) and provide accurate information. You can sign up with email, which you must activate through the link we send, or with Google. You're responsible for keeping your password safe and for activity on your account."],
["4. Prices and payment","Prices are shown in US dollars. Payments are processed by <b>Polar</b> as Merchant of Record: Polar charges you, calculates and remits applicable taxes and issues your receipt. Tono never sees or stores your card details. After paying you get a personal <b>license key</b> to activate your purchase in your account. Each plan covers a number of voices: Voice Pack 1, Pro 1, Agency 5."],
["5. Refunds","Voice Pack: request a refund within 14 days of purchase if you haven't activated the key yet. Pro and Agency: include two rounds of tweaks; if it still doesn't sound like you, we refund you if you ask within 30 days. Write to {email}. This doesn't limit any rights your local consumer law gives you."],
["6. Your texts and your Voice Pack","Your texts remain yours. You give us a limited permission to process them only to provide the service. The Voice Pack you generate is for your use, in any AI tool. You confirm you have the right to use the texts you provide."],
["7. Acceptable use","You may not use Tono to: create a Voice Pack of another person without their permission; impersonate anyone or mislead about who is writing; commit fraud, spam or spread disinformation; break academic or professional rules on AI use; or infringe third-party rights or the law. We may suspend accounts that do."],
["8. AI outputs","Text an AI produces with your Voice Pack may contain mistakes. Review it before publishing: you're responsible for what you publish. Third-party tools (ChatGPT, Claude, Gemini or others) are governed by their own terms. We don't promise that text won't be identified as AI-generated."],
["9. Availability and changes","We work to keep Tono running, but interruptions can happen. We may improve or change features; if a change affects something you paid for, we'll tell you."],
["10. Liability","To the extent permitted by law, {company}'s total liability to you is limited to what you paid in the last 12 months. Nothing here excludes liability that the law doesn't allow us to exclude."],
["11. Governing law","These terms are governed by the laws of the State of Delaware, USA. If you're a consumer, you keep the protection of the mandatory laws of your country of residence and may use its courts."],
["12. Contact","Questions about these terms: <a href=\"mailto:{email}\">{email}</a>."]]},
privacy:{title:"Privacy Policy",s:[
["1. Controller","{company}, {addr}. Privacy contact: <a href=\"mailto:{privacy}\">{privacy}</a>."],
["2. Data we process","<ul><li><b>Account</b>: email, name, language, sign-in method (email or Google) and your consents.</li><li><b>Texts you analyze</b>: analysis runs in your browser. They're only stored on our servers if you save a Voice Pack to your account or request a Pro review.</li><li><b>Saved Voice Packs</b> and your license data (plan and key).</li><li><b>Forms</b>: contact messages and mailing-list sign-ups.</li><li><b>Purchases</b>: Polar shares your email, the product and the license. We never receive card data.</li><li><b>Minimal technical sign-in data</b> logged by our authentication provider for security.</li></ul>We don't use advertising cookies or third-party trackers. Preferences (language, drafts) are kept in your browser's local storage."],
["3. Purposes and legal bases","Providing the service and managing your account and purchases (contract); answering your messages and protecting the service (legitimate interest); sending news only if you opted in (consent, which you can withdraw anytime); meeting legal obligations."],
["4. Who we share it with","Only service providers that help us operate, under contract: Google Firebase (accounts and database), Polar (payments and taxes), our web host (Cloudflare or Vercel) and, if enabled, FormSubmit to notify us of contact messages. If you use the optional rewrite feature with your own API key, your text goes directly to that AI provider. We don't sell or share your data for advertising."],
["5. International transfers","Our providers may process data in the United States and other countries. We use providers offering recognized safeguards, such as the EU Standard Contractual Clauses."],
["6. Retention","Account and Voice Packs: while you keep your account. Pro review texts: deleted 30 days after delivery. Contact messages: up to 24 months. Mailing list: until you unsubscribe. Billing records: as required by law (handled by Polar)."],
["7. Your rights","You can request access, correction, deletion, portability, objection or restriction, and withdraw consent, by writing to {privacy}. We answer within 30 days. Depending on where you live: <ul><li><b>EU/EEA and UK</b> (GDPR): you can complain to your data protection authority.</li><li><b>Brazil</b> (LGPD): you can contact the ANPD.</li><li><b>California</b> (CCPA/CPRA): we don't sell or share personal information and won't discriminate against you for exercising your rights.</li><li><b>Peru</b> (Law 29733): ARCO rights before the National Personal Data Protection Authority.</li><li><b>Elsewhere</b>: we apply these same rights.</li></ul>"],
["8. Children","Tono isn't directed at anyone under 18 and we don't knowingly collect their data."],
["9. Security","We use encrypted connections, passwords managed by Firebase (we never see them) and rules that stop users from reading each other's data. If an incident affects you, we'll notify you as the law requires."],
["10. Changes","If we change this policy we'll say so on the site and, if it's significant, by email."]]},
ai:{title:"Artificial intelligence use & regulation",s:[
["1. What AI does in Tono","<ul><li><b>Voice analysis and detector</b>: run in your browser using statistical methods and phrase lists; they don't use a generative model or send your texts to third parties.</li><li><b>Voice Pack</b>: a set of instructions you use in third-party AI assistants (ChatGPT, Claude, Gemini or others). That text is generated by the provider you choose, under its own terms.</li><li><b>Optional rewrite</b>: if you enter your own API key, your text is sent to that provider only when you ask.</li><li><b>Pro plan</b>: a human editor reviews and adjusts the pack.</li></ul>"],
["2. Our commitments","<ul><li><b>Transparency</b>: we say clearly which parts are automated and which are human.</li><li><b>Your texts don't train models</b> unless you give separate, optional and revocable permission.</li><li><b>Human oversight</b>: you decide what to publish; Tono publishes nothing for you.</li><li><b>No automated decisions</b> with legal or similarly significant effects on people.</li><li><b>No impersonation</b>: only your own voice, or someone who authorized you.</li><li><b>Honest claims</b>: we don't sell “detector evasion”; we help text sound like you.</li></ul>"],
["3. European Union · AI Act (EU) 2024/1689","Tono doesn't engage in prohibited practices and isn't a high-risk system: it's a writing-assistance tool. The Article 50 transparency obligations apply from 2 August 2026. Tono tells users when AI is involved. Machine-readable marking of AI-generated content (Art. 50(2)) is a duty of the providers of the models that generate it. If you publish AI-generated or manipulated text to inform the public on matters of public interest, Art. 50(4) may require you to disclose it, unless there's human review and someone holds editorial responsibility."],
["4. Peru · Law 31814 and its Regulation (D.S. 115-2025-PCM)","The Regulation has been in force since 22 January 2026. We apply its principles of transparency, privacy, human oversight and non-discrimination, and handle data under Personal Data Protection Law 29733."],
["5. Brazil","The AI legal framework (PL 2338/2023) is still before the Chamber of Deputies. Meanwhile we apply the LGPD and ANPD guidance, and will adapt once the law passes."],
["6. United States","There's no general federal AI law. We follow consumer-protection rules on truthful advertising (FTC) and applicable state privacy laws. Tono makes no consequential decisions about employment, credit, housing or other areas covered by state AI laws."],
["7. Other countries","In Canada, Mexico, Colombia, Chile, Argentina and our other markets we apply the data protection laws in force and these same principles. We review this page when regulation changes."],
["8. Contact","Questions about AI, data or misuse of Tono: <a href=\"mailto:{privacy}\">{privacy}</a>."]]}},

terms:{title:"Termos de uso",s:[
["1. Quem somos","O Tono é um serviço da {company}, sociedade de responsabilidade limitada constituída em Delaware, Estados Unidos, com endereço em {addr}. Contato: <a href=\"mailto:{email}\">{email}</a>."],
["2. O que oferecemos","O Tono analisa textos que você envia e gera um <b>Voice Pack</b>: um guia de estilo, uma instrução para assistentes de IA (como ChatGPT, Claude ou Gemini) e listas de frases a evitar. A análise e o detector são grátis; o Voice Pack completo e os planos Pro e Agências são pagamentos únicos."],
["3. Sua conta","Você precisa ter 18 anos ou mais (ou a maioridade do seu país) e informar dados verdadeiros. Pode se cadastrar com e-mail, que deve ativar pelo link que enviamos, ou com o Google. Você é responsável pela segurança da sua senha e pela atividade da sua conta."],
["4. Preços e pagamento","Os preços aparecem em dólares americanos. Os pagamentos são processados pela <b>Polar</b> como Merchant of Record: a Polar cobra, calcula e recolhe os impostos aplicáveis e emite o comprovante. O Tono não vê nem guarda os dados do seu cartão. Após o pagamento você recebe uma <b>chave de licença</b> pessoal para ativar a compra na sua conta. Cada plano cobre um número de vozes: Voice Pack 1, Pro 1 e Agências 5."],
["5. Reembolsos","Voice Pack: peça o reembolso em até 14 dias após a compra se ainda não ativou a chave. Pro e Agências: incluem duas rodadas de ajuste; se mesmo assim não soar como você, devolvemos o dinheiro se pedir em até 30 dias. Escreva para {email}. Isso não limita os direitos que o Código de Defesa do Consumidor ou a lei do seu país lhe dão."],
["6. Seus textos e seu Voice Pack","Seus textos continuam sendo seus. Você nos dá uma permissão limitada para processá-los apenas para prestar o serviço. O Voice Pack gerado é para seu uso, em qualquer ferramenta de IA. Você declara ter direito de usar os textos enviados."],
["7. Uso aceitável","Você não pode usar o Tono para: criar o Voice Pack de outra pessoa sem autorização; se passar por alguém ou enganar sobre quem escreve; fraude, spam ou desinformação; descumprir regras acadêmicas ou profissionais sobre IA; ou violar direitos de terceiros ou a lei. Podemos suspender contas que façam isso."],
["8. Resultados da IA","O texto que uma IA produzir com seu Voice Pack pode ter erros. Revise antes de publicar: você é responsável pelo que publica. Ferramentas de terceiros (ChatGPT, Claude, Gemini ou outras) seguem seus próprios termos. Não prometemos que um texto não será identificado como gerado por IA."],
["9. Disponibilidade e mudanças","Trabalhamos para que o Tono funcione sempre, mas pode haver interrupções. Podemos melhorar ou mudar funções; se uma mudança afetar algo que você pagou, avisaremos."],
["10. Responsabilidade","Na medida permitida por lei, a responsabilidade total da {company} perante você limita-se ao que você pagou nos últimos 12 meses. Nada aqui exclui responsabilidades que a lei não permite excluir."],
["11. Lei aplicável","Estes termos são regidos pelas leis do Estado de Delaware, EUA. Se você é consumidor, mantém a proteção das leis obrigatórias do seu país de residência e pode recorrer aos tribunais de lá."],
["12. Contato","Dúvidas sobre estes termos: <a href=\"mailto:{email}\">{email}</a>."]]},
privacy:{title:"Política de privacidade",s:[
["1. Controlador","{company}, {addr}. Contato de privacidade: <a href=\"mailto:{privacy}\">{privacy}</a>."],
["2. Dados que tratamos","<ul><li><b>Conta</b>: e-mail, nome, idioma, forma de acesso (e-mail ou Google) e seus consentimentos.</li><li><b>Textos analisados</b>: a análise roda no seu navegador. Só ficam nos nossos servidores se você salvar um Voice Pack na conta ou pedir a revisão Pro.</li><li><b>Voice Packs salvos</b> e dados da sua licença (plano e chave).</li><li><b>Formulários</b>: mensagens de contato e inscrição na lista.</li><li><b>Compras</b>: a Polar nos informa seu e-mail, o produto e a licença. Não recebemos dados de cartão.</li><li><b>Dados técnicos mínimos</b> de login registrados pelo provedor de autenticação por segurança.</li></ul>Não usamos cookies de publicidade nem rastreadores de terceiros. Preferências (idioma, rascunhos) ficam no armazenamento local do navegador."],
["3. Finalidades e bases legais","Prestar o serviço e gerenciar sua conta e compras (execução de contrato); responder mensagens e proteger o serviço (legítimo interesse); enviar novidades só se você aceitou (consentimento, que pode ser revogado a qualquer momento); cumprir obrigações legais."],
["4. Com quem compartilhamos","Só com operadores que nos ajudam a funcionar, sob contrato: Google Firebase (contas e banco de dados), Polar (pagamentos e impostos), nosso provedor de hospedagem (Cloudflare ou Vercel) e, se ativado, FormSubmit para nos avisar de mensagens de contato. Se você usar a reescrita opcional com sua própria chave de API, o texto vai direto para esse provedor de IA. Não vendemos nem compartilhamos seus dados para publicidade."],
["5. Transferências internacionais","Nossos operadores podem tratar dados nos Estados Unidos e em outros países. Usamos provedores com garantias reconhecidas, como as cláusulas contratuais padrão."],
["6. Por quanto tempo","Conta e Voice Packs: enquanto você mantiver a conta. Textos da revisão Pro: apagados 30 dias após a entrega. Mensagens de contato: até 24 meses. Lista de e-mails: até você sair. Dados fiscais: o que a lei exigir (geridos pela Polar)."],
["7. Seus direitos","Você pode pedir confirmação, acesso, correção, anonimização, eliminação, portabilidade e informação sobre compartilhamento, e revogar o consentimento, escrevendo para {privacy}. Respondemos em até 15 dias. Conforme onde você mora: <ul><li><b>Brasil</b> (LGPD): você pode peticionar à ANPD.</li><li><b>UE/EEE e Reino Unido</b> (RGPD): você pode reclamar à sua autoridade de proteção de dados.</li><li><b>Califórnia</b> (CCPA/CPRA): não vendemos nem compartilhamos dados pessoais.</li><li><b>Peru</b> (Lei 29733): direitos ARCO perante a autoridade nacional.</li><li><b>Outros países</b>: aplicamos estes mesmos direitos.</li></ul>"],
["8. Menores","O Tono não se destina a menores de 18 anos e não coletamos seus dados conscientemente."],
["9. Segurança","Usamos conexões criptografadas, senhas geridas pelo Firebase (nunca as vemos) e regras que impedem um usuário de ler dados de outro. Se houver um incidente que afete você, avisaremos conforme a lei."],
["10. Mudanças","Se mudarmos esta política, avisaremos no site e, se for relevante, por e-mail."]]},
ai:{title:"Uso de inteligência artificial e regulação",s:[
["1. O que a IA faz no Tono","<ul><li><b>Análise de voz e detector</b>: rodam no seu navegador com métodos estatísticos e listas de expressões; não usam modelo generativo nem enviam seus textos a terceiros.</li><li><b>Voice Pack</b>: é um conjunto de instruções que você usa em assistentes de IA de terceiros (ChatGPT, Claude, Gemini ou outros). O texto é gerado pelo provedor que você escolher, sob os termos dele.</li><li><b>Reescrita opcional</b>: se você informar sua própria chave de API, o texto é enviado a esse provedor só quando você pedir.</li><li><b>Plano Pro</b>: um editor humano revisa e ajusta o pack.</li></ul>"],
["2. Nossos compromissos","<ul><li><b>Transparência</b>: dizemos com clareza o que é automático e o que é humano.</li><li><b>Seus textos não treinam modelos</b>, salvo permissão separada, opcional e revogável.</li><li><b>Supervisão humana</b>: você decide o que publica; o Tono não publica nada por você.</li><li><b>Sem decisões automatizadas</b> com efeitos jurídicos ou similares sobre pessoas.</li><li><b>Sem se passar por outra pessoa</b>: só a sua voz ou a de quem autorizou.</li><li><b>Promessas honestas</b>: não vendemos “burlar detectores”; ajudamos o texto a soar como você.</li></ul>"],
["3. União Europeia · Regulamento de IA (UE) 2024/1689","O Tono não realiza práticas proibidas e não é um sistema de alto risco: é uma ferramenta de apoio à escrita. As obrigações de transparência do artigo 50 se aplicam desde 2 de agosto de 2026. O Tono informa aos usuários quando a IA atua. A marcação técnica do conteúdo gerado por IA (art. 50.º, n.º 2) cabe aos fornecedores dos modelos que o geram. Se você publicar texto gerado ou manipulado por IA para informar o público sobre assuntos de interesse público, o art. 50.º, n.º 4, pode exigir que você o indique, salvo se houver revisão humana e alguém assumir a responsabilidade editorial."],
["4. Peru · Lei 31814 e seu Regulamento (D.S. 115-2025-PCM)","O Regulamento vigora desde 22 de janeiro de 2026. Aplicamos seus princípios de transparência, privacidade, supervisão humana e não discriminação, e tratamos os dados conforme a Lei 29733."],
["5. Brasil","O marco legal da IA (PL 2338/2023) ainda tramita na Câmara dos Deputados. Enquanto isso, aplicamos a LGPD e as orientações da ANPD e vamos nos adaptar quando a lei for aprovada."],
["6. Estados Unidos","Não há lei federal geral de IA. Seguimos as regras de defesa do consumidor sobre publicidade verdadeira (FTC) e as leis estaduais de privacidade aplicáveis. O Tono não toma decisões relevantes sobre emprego, crédito, moradia ou outras áreas cobertas por leis estaduais de IA."],
["7. Outros países","No Canadá, México, Colômbia, Chile, Argentina e demais mercados aplicamos as leis de dados pessoais vigentes e estes mesmos princípios. Revisamos esta página quando a regulação muda."],
["8. Contato","Dúvidas sobre IA, dados ou uso indevido do Tono: <a href=\"mailto:{privacy}\">{privacy}</a>."]]}},

/* ================================== FRANÇAIS ================================== */
fr:{tabs:{terms:"Conditions",privacy:"Confidentialité",ai:"Usage de l’IA et réglementation"},updated:"Dernière mise à jour",draft:"Version 1.0. Rédigée pour le lancement ; elle sera revue par un avocat. Si la loi de votre pays vous accorde davantage de droits, cette loi s’applique.",back:"Retour à Tono",
terms:{title:"Conditions générales d’utilisation",s:[
["1. Qui sommes-nous","Tono est un service de {company}, société à responsabilité limitée constituée au Delaware (États-Unis), située {addr}. Contact : <a href=\"mailto:{email}\">{email}</a>."],
["2. Notre offre","Tono analyse les textes que vous fournissez et génère un <b>Voice Pack</b> : un guide de style, une instruction pour assistants d’IA (comme ChatGPT, Claude ou Gemini) et des listes de formules à éviter. L’analyse et le détecteur sont gratuits ; le Voice Pack complet et les offres Pro et Agences sont des paiements uniques."],
["3. Votre compte","Vous devez avoir au moins 18 ans (ou l’âge de la majorité dans votre pays) et fournir des informations exactes. Inscription par e-mail, à activer via le lien envoyé, ou avec Google. Vous êtes responsable de la sécurité de votre mot de passe et de l’activité de votre compte."],
["4. Prix et paiement","Les prix sont affichés en dollars américains. Les paiements sont traités par <b>Polar</b> en tant que Merchant of Record : Polar encaisse, calcule et reverse les taxes applicables et émet votre reçu. Tono ne voit ni ne conserve vos données de carte. Après paiement, vous recevez une <b>clé de licence</b> personnelle pour activer votre achat dans votre compte. Chaque offre couvre un nombre de voix : Voice Pack 1, Pro 1, Agences 5."],
["5. Remboursements","Voice Pack : remboursement sur demande dans les 14 jours suivant l’achat si la clé n’a pas encore été activée. Pro et Agences : deux tours d’ajustement inclus ; si cela ne sonne toujours pas comme vous, nous vous remboursons sur demande dans les 30 jours. Écrivez à {email}. Cela ne limite pas les droits que vous accorde le droit de la consommation de votre pays."],
["6. Vos textes et votre Voice Pack","Vos textes restent les vôtres. Vous nous accordez une autorisation limitée de les traiter uniquement pour fournir le service. Le Voice Pack généré est destiné à votre usage, dans n’importe quel outil d’IA. Vous déclarez avoir le droit d’utiliser les textes fournis."],
["7. Usage acceptable","Il est interdit d’utiliser Tono pour : créer le Voice Pack d’une autre personne sans son accord ; usurper une identité ou tromper sur l’auteur d’un texte ; la fraude, le spam ou la désinformation ; enfreindre des règles académiques ou professionnelles sur l’IA ; violer les droits de tiers ou la loi. Nous pouvons suspendre les comptes concernés."],
["8. Résultats de l’IA","Le texte produit par une IA avec votre Voice Pack peut contenir des erreurs. Relisez-le avant de publier : vous êtes responsable de ce que vous publiez. Les outils tiers (ChatGPT, Claude, Gemini ou autres) relèvent de leurs propres conditions. Nous ne garantissons pas qu’un texte ne sera pas identifié comme généré par IA."],
["9. Disponibilité et évolutions","Nous faisons en sorte que Tono fonctionne en continu, mais des interruptions peuvent survenir. Nous pouvons améliorer ou modifier des fonctions ; si un changement touche ce que vous avez payé, nous vous préviendrons."],
["10. Responsabilité","Dans la mesure permise par la loi, la responsabilité totale de {company} envers vous est limitée aux montants payés au cours des 12 derniers mois. Rien ici n’exclut une responsabilité que la loi interdit d’exclure."],
["11. Droit applicable","Ces conditions sont régies par le droit de l’État du Delaware (États-Unis). Si vous êtes consommateur, vous conservez la protection des dispositions impératives de votre pays de résidence et pouvez saisir ses tribunaux."],
["12. Contact","Questions sur ces conditions : <a href=\"mailto:{email}\">{email}</a>."]]},
privacy:{title:"Politique de confidentialité",s:[
["1. Responsable du traitement","{company}, {addr}. Contact confidentialité : <a href=\"mailto:{privacy}\">{privacy}</a>."],
["2. Données traitées","<ul><li><b>Compte</b> : e-mail, nom, langue, mode de connexion (e-mail ou Google) et vos consentements.</li><li><b>Textes analysés</b> : l’analyse se fait dans votre navigateur. Ils ne sont stockés sur nos serveurs que si vous enregistrez un Voice Pack ou demandez la relecture Pro.</li><li><b>Voice Packs enregistrés</b> et données de licence (offre et clé).</li><li><b>Formulaires</b> : messages de contact et inscription à la liste.</li><li><b>Achats</b> : Polar nous transmet votre e-mail, le produit et la licence. Nous ne recevons aucune donnée de carte.</li><li><b>Données techniques minimales</b> de connexion enregistrées par notre fournisseur d’authentification pour la sécurité.</li></ul>Aucun cookie publicitaire ni traceur tiers. Vos préférences (langue, brouillons) restent dans le stockage local de votre navigateur."],
["3. Finalités et bases légales","Fournir le service et gérer votre compte et vos achats (exécution du contrat) ; répondre à vos messages et protéger le service (intérêt légitime) ; vous envoyer des nouvelles uniquement si vous l’avez accepté (consentement, révocable à tout moment) ; respecter nos obligations légales."],
["4. Destinataires","Uniquement des sous-traitants qui nous aident à fonctionner, sous contrat : Google Firebase (comptes et base de données), Polar (paiements et taxes), notre hébergeur web (Cloudflare ou Vercel) et, s’il est activé, FormSubmit pour nous signaler les messages de contact. Si vous utilisez la réécriture optionnelle avec votre propre clé d’API, votre texte est envoyé directement à ce fournisseur d’IA. Nous ne vendons ni ne partageons vos données à des fins publicitaires."],
["5. Transferts internationaux","Nos sous-traitants peuvent traiter des données aux États-Unis et dans d’autres pays. Nous retenons des prestataires offrant des garanties reconnues, comme les clauses contractuelles types de la Commission européenne."],
["6. Durée de conservation","Compte et Voice Packs : tant que vous gardez votre compte. Textes de relecture Pro : supprimés 30 jours après la livraison. Messages de contact : jusqu’à 24 mois. Liste de diffusion : jusqu’à votre désinscription. Données de facturation : selon la loi (gérées par Polar)."],
["7. Vos droits","Vous pouvez demander l’accès, la rectification, l’effacement, la portabilité, l’opposition ou la limitation, et retirer votre consentement, en écrivant à {privacy}. Réponse sous 30 jours. Selon votre pays : <ul><li><b>UE/EEE et Royaume-Uni</b> (RGPD) : vous pouvez saisir votre autorité de protection des données (en France, la CNIL).</li><li><b>Brésil</b> (LGPD) : vous pouvez saisir l’ANPD.</li><li><b>Californie</b> (CCPA/CPRA) : nous ne vendons ni ne partageons de données personnelles.</li><li><b>Pérou</b> (loi 29733) : droits ARCO auprès de l’autorité nationale.</li><li><b>Ailleurs</b> : nous appliquons ces mêmes droits.</li></ul>"],
["8. Mineurs","Tono ne s’adresse pas aux moins de 18 ans et nous ne collectons pas sciemment leurs données."],
["9. Sécurité","Connexions chiffrées, mots de passe gérés par Firebase (nous ne les voyons jamais) et règles empêchant un utilisateur de lire les données d’un autre. En cas d’incident vous concernant, nous vous informerons conformément à la loi."],
["10. Modifications","Toute modification sera signalée sur le site et, si elle est importante, par e-mail."]]},
ai:{title:"Usage de l’intelligence artificielle et réglementation",s:[
["1. Ce que fait l’IA dans Tono","<ul><li><b>Analyse de voix et détecteur</b> : fonctionnent dans votre navigateur avec des méthodes statistiques et des listes d’expressions ; ils n’utilisent pas de modèle génératif et n’envoient pas vos textes à des tiers.</li><li><b>Voice Pack</b> : un ensemble d’instructions que vous utilisez dans des assistants d’IA tiers (ChatGPT, Claude, Gemini ou autres). Le texte est généré par le fournisseur choisi, selon ses propres conditions.</li><li><b>Réécriture optionnelle</b> : si vous saisissez votre propre clé d’API, votre texte est envoyé à ce fournisseur uniquement à votre demande.</li><li><b>Offre Pro</b> : un éditeur humain relit et ajuste le pack.</li></ul>"],
["2. Nos engagements","<ul><li><b>Transparence</b> : nous indiquons clairement ce qui est automatisé et ce qui est humain.</li><li><b>Vos textes n’entraînent aucun modèle</b>, sauf autorisation distincte, facultative et révocable.</li><li><b>Contrôle humain</b> : vous décidez de ce que vous publiez ; Tono ne publie rien à votre place.</li><li><b>Aucune décision automatisée</b> produisant des effets juridiques ou similaires sur des personnes.</li><li><b>Aucune usurpation</b> : uniquement votre voix, ou celle d’une personne qui vous y a autorisé.</li><li><b>Promesses honnêtes</b> : nous ne vendons pas le « contournement des détecteurs » ; nous aidons le texte à sonner comme vous.</li></ul>"],
["3. Union européenne · Règlement (UE) 2024/1689 sur l’IA","Tono ne relève d’aucune pratique interdite et n’est pas un système à haut risque : c’est un outil d’aide à l’écriture. Les obligations de transparence de l’article 50 s’appliquent depuis le 2 août 2026. Tono informe ses utilisateurs lorsque l’IA intervient. Le marquage technique des contenus générés par IA (art. 50, § 2) incombe aux fournisseurs des modèles qui les génèrent. Si vous publiez un texte généré ou manipulé par IA afin d’informer le public sur des questions d’intérêt public, l’art. 50, § 4, peut vous imposer de le signaler, sauf relecture humaine et responsabilité éditoriale assumée."],
["4. Pérou · Loi 31814 et son règlement (D.S. 115-2025-PCM)","Le règlement est en vigueur depuis le 22 janvier 2026. Nous appliquons ses principes de transparence, de confidentialité, de contrôle humain et de non-discrimination, et traitons les données selon la loi 29733."],
["5. Brésil","Le cadre légal de l’IA (PL 2338/2023) est toujours examiné par la Chambre des députés. En attendant, nous appliquons la LGPD et les orientations de l’ANPD, et nous nous adapterons dès son adoption."],
["6. États-Unis","Il n’existe pas de loi fédérale générale sur l’IA. Nous respectons les règles de protection des consommateurs sur la publicité loyale (FTC) et les lois étatiques applicables en matière de vie privée. Tono ne prend aucune décision significative en matière d’emploi, de crédit, de logement ou d’autres domaines couverts par les lois étatiques sur l’IA."],
["7. Autres pays","Au Canada (dont le Québec et sa Loi 25), au Mexique, en Colombie, au Chili, en Argentine et sur nos autres marchés, nous appliquons les lois en vigueur sur les données personnelles et ces mêmes principes. Nous mettons cette page à jour quand la réglementation évolue."],
["8. Contact","Questions sur l’IA, les données ou un usage abusif de Tono : <a href=\"mailto:{privacy}\">{privacy}</a>."]]}}
};

const fillV=s=>s.replace(/\{(company|addr|email|privacy|brand)\}/g,(m,k)=>V[k]);
let lang=(()=>{const q=new URLSearchParams(location.search).get("lang");let s=null;try{s=localStorage.getItem("tono_lang")}catch(e){}const n=(navigator.language||"es").slice(0,2);return L[q]?q:L[s]?s:L[n]?n:"es"})();
function page(){const h=location.hash.slice(1);return["terms","privacy","ai"].includes(h)?h:"terms"}
function render(){
  const D=L[lang],p=page(),d=D[p];
  document.documentElement.lang=lang;document.title="Tono · "+D.tabs[p];
  document.getElementById("tabs").innerHTML=["terms","privacy","ai"].map(k=>`<a href="#${k}" ${k===p?'aria-current="page"':""}>${D.tabs[k]}</a>`).join("");
  document.querySelectorAll("[data-lang]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===lang));
  document.getElementById("doc").innerHTML=`<h1>${d.title}</h1><div class="meta">${D.updated}: ${UPDATED} · ${V.company}</div><div class="note">${D.draft}</div>`+d.s.map(([h,b])=>`<h2>${h}</h2><div>${/^<ul>/.test(b)?fillV(b):"<p>"+fillV(b)+"</p>"}</div>`).join("");
  document.getElementById("foot").innerHTML=`© 2026 ${V.brand} · ${V.company} · ${V.addr} · <a href="index.html#${lang}">${D.back}</a>`;
}
document.addEventListener("click",e=>{const b=e.target.closest("[data-lang]");if(b){lang=b.dataset.lang;try{localStorage.setItem("tono_lang",lang)}catch(er){}render()}});
addEventListener("hashchange",()=>{render();scrollTo(0,0)});
render();
</script>
